[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aorticturb"
version = "0.1.0"
description = "Reproducible turbulence classification and canonical diagnostics for tomographic PIV of aortic-valve flow."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Khalid M. Saqr"}
]
license = {text = "BSD-3-Clause"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "requests>=2.31",
  "typer>=0.12",
  "rich>=13.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6"
]

[project.scripts]
aorticturb = "aorticturb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
